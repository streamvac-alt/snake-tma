<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Змейка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #17212b; color: #fff; font-family: -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden; user-select: none; 
        }
        #score { font-size: 18px; margin-bottom: 8px; }
        #high { font-size: 14px; color: #8b9bb4; margin-bottom: 12px; }
        canvas { border: 2px solid #2b3b4e; border-radius: 8px; background: #0e1621; touch-action: none; }
        #overlay {
            position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
            flex-direction: column; background: rgba(14, 22, 33, 0.92); border-radius: 8px;
            text-align: center; padding: 20px;
        }
        #overlay h2 { margin-bottom: 10px; }
        #overlay button {
            margin-top: 16px; padding: 12px 28px; font-size: 16px; border: none;
            border-radius: 8px; background: #2ea6ff; color: #fff; cursor: pointer;
        }
        #wrap { position: relative; display: inline-block; }
        #hint { margin-top: 12px; font-size: 13px; color: #6c7883; }
    </style>
</head>
<body>
    <div id="score">Счёт: 0</div>
    <div id="high">Рекорд: 0</div>
    <div id="wrap">
        <canvas id="game"></canvas>
        <div id="overlay">
            <h2 id="overlay-title">Игра окончена</h2>
            <p id="overlay-text"></p>
            <button onclick="restart()">Играть снова</button>
        </div>
    </div>
    <div id="hint">Свайп или стрелки для управления</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const CELL = 20, COLS = 15, ROWS = 15;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;

let snake, dir, nextDir, food, score, highScore = 0, timer, alive;
let initData = tg?.initData || '';

const scoreEl = document.getElementById('score');
const highEl = document.getElementById('high');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlayText = document.getElementById('overlay-text');

async function authenticate() {
    if (!initData) return;
    try {
        const res = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ init_data: initData })
        });
        const data = await res.json();
        if (data.ok) {
            highScore = data.high_score;
            highEl.textContent = 'Рекорд: ' + highScore;
        }
    } catch (e) { console.warn('Auth failed', e); }
}

function reset() {
    snake = [{x: 7, y: 7}, {x: 6, y: 7}, {x: 5, y: 7}];
    dir = {x: 1, y: 0}; nextDir = {x: 1, y: 0};
    score = 0; alive = true;
    scoreEl.textContent = 'Счёт: 0';
    overlay.style.display = 'none';
    placeFood(); draw();
}

function placeFood() {
    while (true) {
        const f = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
        if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
}

function step() {
    if (!alive) return;
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS || snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver(); return;
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
        score += 10; scoreEl.textContent = 'Счёт: ' + score;
        tg?.HapticFeedback?.impactOccurred('light');
        placeFood();
    } else { snake.pop(); }
    draw();
}

function draw() {
    ctx.fillStyle = '#0e1621'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff5c5c';
    ctx.beginPath(); ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2); ctx.fill();
    snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#2ea6ff' : '#1c7ed6';
        ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });
}

async function gameOver() {
    alive = false; clearInterval(timer);
    tg?.HapticFeedback?.notificationOccurred('error');
    overlayTitle.textContent = 'Игра окончена';
    overlayText.textContent = 'Ваш счёт: ' + score;
    overlay.style.display = 'flex';

    if (score > highScore) {
        highScore = score; highEl.textContent = 'Рекорд: ' + highScore;
        if (initData) {
            try {
                await fetch('/api/score', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ init_data: initData, score })
                });
            } catch (e) { console.warn(e); }
        }
    }
}

function restart() {
    reset(); clearInterval(timer); timer = setInterval(step, 150);
}

function setDir(x, y) { if (dir.x === -x && dir.y === -y) return; nextDir = {x, y}; }

document.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp') setDir(0, -1);
    if (e.key === 'ArrowDown') setDir(0, 1);
    if (e.key === 'ArrowLeft') setDir(-1, 0);
    if (e.key === 'ArrowRight') setDir(1, 0);
});

let touchStart = null;
canvas.addEventListener('touchstart', e => { touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY}; }, {passive: true});
canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 20) setDir(1, 0); else if (dx < -20) setDir(-1, 0);
    } else {
        if (dy > 20) setDir(0, 1); else if (dy < -20) setDir(0, -1);
    }
    touchStart = null;
}, {passive: true});

authenticate();
reset();
timer = setInterval(step, 150);
</script>
</body>
</html>
