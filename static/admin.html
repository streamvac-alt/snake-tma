<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Админ-панель Sunrise</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h1>Панель управления</h1>
            <input type="password" id="pass-input" placeholder="Введите пароль" onkeypress="if(event.key === 'Enter') login()">
            <button onclick="login()">Войти</button>
        </div>
    </div>

    <div id="app-screen">
        <header>
            <h2>Sunrise Admin</h2>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </header>

        <div class="shift-panel">
            <div class="shift-status">
                Статус смены: <span id="shift-status-text">Загрузка...</span>
            </div>
            <button id="btn-shift" onclick="toggleShift()">Открыть смену</button>
        </div>

        <div class="tabs">
            <button class="active" onclick="switchTab('orders', this)">Активные заказы</button>
            <button onclick="switchTab('menu', this)">Стоп-лист</button>
        </div>

        <div id="tab-orders" class="tab-content active">
            <div id="orders-list" class="orders-list">
                <div class="empty">Загрузка...</div>
            </div>
        </div>

        <div id="tab-menu" class="tab-content">
            <div id="menu-list" class="menu-list">
                <div class="empty">Загрузка меню...</div>
            </div>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
