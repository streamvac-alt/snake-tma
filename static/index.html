<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #090a0f; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; touch-action: none;
        }
        .hud { display: flex; gap: 30px; margin-bottom: 15px; font-weight: bold; font-size: 18px; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .score { color: #00ffcc; }
        .high { color: #ff0055; }
        canvas { border-radius: 12px; box-shadow: 0 0 30px rgba(0, 255, 204, 0.2); background: #090a0f; }
        #overlay {
            position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
            flex-direction: column; background: rgba(9, 10, 15, 0.9); backdrop-filter: blur(5px);
            z-index: 10;
        }
        #overlay h1 { color: #ff0055; font-size: 32px; margin-bottom: 10px; text-shadow: 0 0 20px #ff0055; }
        #overlay p { font-size: 18px; margin-bottom: 20px; color: #888; }
        #overlay button {
            padding: 15px 40px; font-size: 18px; font-weight: bold; border: none; border-radius: 30px;
            background: #00ffcc; color: #000; cursor: pointer; box-shadow: 0 0 20px #00ffcc;
            transition: transform 0.1s;
        }
        #overlay button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="hud">
        <div class="score" id="score">СЧЁТ: 0</div>
        <div class="high" id="high">РЕКОРД: 0</div>
    </div>
    <canvas id="game"></canvas>
    
    <div id="overlay">
        <h1>GAME OVER</h1>
        <p>Твой счёт: <span id="final-score" style="color:#fff">0</span></p>
        <button onclick="restart()">ИГРАТЬ СНОВА</button>
    </div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();
if (tg) tg.setHeaderColor('#090a0f');

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Настройки поля (квадратное для мобилок)
const CELL = 20;
let COLS, ROWS;

function resize() {
    const size = Math.min(window.innerWidth * 0.95, window.innerHeight * 0.7);
    COLS = Math.floor(size / CELL);
    ROWS = Math.floor(size / CELL);
    canvas.width = COLS * CELL;
    canvas.height = ROWS * CELL;
}
resize();
window.addEventListener('resize', resize);

let snake, dir, nextDir, food, score, highScore = 0, alive, gameLoop;
let particles = [];
let initData = tg?.initData || '';

const scoreEl = document.getElementById('score');
const highEl = document.getElementById('high');
const overlay = document.getElementById('overlay');
const finalScoreEl = document.getElementById('final-score');

// --- Авторизация ---
async function authenticate() {
    if (!initData) return;
    try {
        const res = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ init_data: initData })
        });
        const data = await res.json();
        if (data.ok) {
            highScore = data.high_score;
            highEl.textContent = 'РЕКОРД: ' + highScore;
        }
    } catch (e) {}
}

// --- Логика игры ---
function reset() {
    snake = [{x: Math.floor(COLS/2), y: Math.floor(ROWS/2)}];
    dir = {x: 1, y: 0}; nextDir = {x: 1, y: 0};
    score = 0; alive = true;
    particles = [];
    scoreEl.textContent = 'СЧЁТ: 0';
    overlay.style.display = 'none';
    placeFood();
}

function placeFood() {
    while (true) {
        const f = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
        if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
}

function spawnParticles(x, y, color) {
    for (let i = 0; i < 15; i++) {
        particles.push({
            x: x * CELL + CELL/2, y: y * CELL + CELL/2,
            vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
            life: 1, color: color
        });
    }
}

function update() {
    if (!alive) return;
    
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // Столкновение со стенами или собой
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS || snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver(); return;
    }

    snake.unshift(head);
    
    if (head.x === food.x && head.y === food.y) {
        score += 10; 
        scoreEl.textContent = 'СЧЁТ: ' + score;
        if (tg) tg.HapticFeedback.impactOccurred('light');
        spawnParticles(food.x, food.y, '#ff0055');
        placeFood();
    } else {
        snake.pop();
    }

    // Обновление частиц
    particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.05; p.vx *= 0.95; p.vy *= 0.95;
    });
    particles = particles.filter(p => p.life > 0);
}

function draw() {
    // Очистка (с полупрозрачностью для шлейфа)
    ctx.fillStyle = '#090a0f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Сетка (неоновая)
    ctx.strokeStyle = 'rgba(0, 255, 204, 0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
    }
    for (let i = 0; i <= ROWS; i++) {
        ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    // Еда (пульсирующая)
    const pulse = Math.sin(Date.now() / 150) * 2;
    ctx.shadowBlur = 20; ctx.shadowColor = '#ff0055'; ctx.fillStyle = '#ff0055';
    ctx.beginPath(); 
    ctx.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, (CELL/2 - 2) + pulse, 0, Math.PI * 2); 
    ctx.fill();

    // Частицы
    particles.forEach(p => {
        ctx.shadowBlur = 10; ctx.shadowColor = p.color;
        ctx.fillStyle = `rgba(255, 0, 85, ${p.life})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
    });

    // Змейка
    ctx.shadowBlur = 15; ctx.shadowColor = '#00ffcc';
    snake.forEach((s, i) => {
        // Плавное затухание цвета к хвосту
        const opacity = Math.max(0.3, 1 - (i / snake.length));
        ctx.fillStyle = i === 0 ? '#fff' : `rgba(0, 255, 204, ${opacity})`;
        
        // Скругленные прямоугольники
        ctx.beginPath();
        ctx.roundRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4, 6);
        ctx.fill();
    });
    
    ctx.shadowBlur = 0; // Сброс тени
}

function gameOver() {
    alive = false;
    if (tg) tg.HapticFeedback.notificationOccurred('error');
    finalScoreEl.textContent = score;
    overlay.style.display = 'flex';
    submitScore();
}

async function submitScore() {
    if (score > highScore) {
        highScore = score;
        highEl.textContent = 'РЕКОРД: ' + highScore;
        if (initData) {
            try {
                await fetch('/api/score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ init_data: initData, score })
                });
            } catch (e) {}
        }
    }
}

// Главный цикл
let lastTime = 0;
const speed = 70; // миллисекунд на шаг

function loop(time) {
    if (alive) {
        if (time - lastTime > speed) {
            update();
            lastTime = time;
        }
        draw();
    }
    requestAnimationFrame(loop);
}

function restart() {
    reset();
    if (tg) tg.HapticFeedback.impactOccurred('medium');
}

// Управление
function setDir(x, y) {
    if (dir.x === -x && dir.y === -y) return; // Запрет разворота на 180
    nextDir = {x, y};
}

document.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') setDir(0, -1);
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') setDir(0, 1);
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') setDir(-1, 0);
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setDir(1, 0);
});

let touchStart = null;
canvas.addEventListener('touchstart', e => { touchStart = {x: e.touches[0].clientX, y: e.touches[0].clientY}; }, {passive: true});
canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 20) setDir(1, 0); else if (dx < -20) setDir(-1, 0);
    } else {
        if (dy > 20) setDir(0, 1); else if (dy < -20) setDir(0, -1);
    }
    touchStart = null;
}, {passive: true});

// Старт
authenticate();
reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
